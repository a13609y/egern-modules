# ============================================================
# 3. MITM 排除
# 这些域名即使被主配置的 MITM 命中也不解密：证书钉扎的 App 一解密就白屏/断连。
# 只声明排除，不会替你把任何域名放进 MITM。
# ============================================================
mitm:
  hostnames:
    excludes:
      # —— 证书钉扎，解密即断连 ——
      - "*.facebook.com"
      - "*.instagram.com"
      - "*.twitter.com"
      - "*.snssdk.com"
      - "*.pstatp.com"

      # —— 系统关键服务，不能碰 ——
      - "gateway.icloud.com"
      - "gateway.icloud.com.cn"
      - "weather-data.apple.com"
      - "buy.itunes.apple.com"
      - "play.itunes.apple.com"
      - "play-edge.itunes.apple.com"
      - "ios.chat.openai.com"
