name: 番茄小说净化（隐藏短剧 / 福利）
description: 改写 App 拿到的 JSON，删除短剧 / 福利 / 金币 / 签到入口与活动中心；只删数据，不拦请求，删错了关掉模块即恢复。
author: a13609y（脚本移植自 Xhy333/QuantumultX · fqnovel-clean.js）
homepage: https://github.com/a13609y/egern-modules/tree/main/rules/fanqie-clean
manual: https://github.com/a13609y/egern-modules/blob/main/rules/fanqie-clean/README.md
icon: text.badge.minus

env_schema:
  HIDE_DRAMA:
    name: 隐藏短剧入口
    description: 删除「短剧」tab 与「剧场」卡片。想自己看短剧就关掉。
    default_value: "true"
    options:
      - "true"
      - "false"
  HIDE_WELFARE:
    name: 隐藏福利 / 金币 / 签到
    description: 删除「我的」与书城里的签到、宝箱、金币、提现、红包、任务等入口。
    default_value: "true"
    options:
      - "true"
      - "false"
  HIDE_ACTIVITY:
    name: 清空活动中心
    description: 活动页列表整块清空。
    default_value: "true"
    options:
      - "true"
      - "false"
  CLEAN_READER:
    name: 清理阅读页广告段
    description: 只删除 JSON 里带明确广告标记的段落，绝不按文字删正文。
    default_value: "true"
    options:
      - "true"
      - "false"
  DEBUG:
    name: 调试日志
    description: 打开后每个命中的请求都会在 Egern 日志里打一行（URL / Content-Type / 是否 JSON），用来判断脚本到底跑没跑。
    default_value: "false"
    options:
      - "false"
      - "true"

scriptings:
  - http_response:
      name: 番茄净化
      match: "^https?://[^/]*\\.(?:fqnovel|snssdk|zijieapi)\\.com/(?:reading|article|api)/"
      script_url: "https://raw.githubusercontent.com/a13609y/egern-modules/main/rules/fanqie-clean/fanqie-clean.js"
      body_required: true
      max_size: 5242880
      timeout: 20

# MITM 覆盖：必须和脚本要改的接口主机一致，否则响应不会被解密、脚本永远不触发
mitm:
  hostnames:
    includes:
      - "*.fqnovel.com"
      - "*.zijieapi.com"
      - "*.snssdk.com"
