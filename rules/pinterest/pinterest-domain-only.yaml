name: Pinterest 去广告（纯域名版，不 MITM）
description: 不开 MITM、不改写响应，只 REJECT Pinterest 明确的广告与追踪域名（ads / ads-dev / ads-api / ad / ct / trk / analytics / widgets）。零副作用，「更多类似内容」不受影响；代价是瀑布流里混在正常数据中的推广 Pin 去不掉。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# 纯域名版：不启用 MITM、不挂脚本，零副作用。
# 域名来源：AWAvenue-Ads-Rule、Peter_Lowe_adservers、ACL4SSR BanAD、
#           blackmatrix7 Advertising 等公开拦截列表的并集（只取 pinterest.com 子域）。
# 已知限制：推广 Pin 的 JSON 里没有可单独拦截的 URL，不做响应改写就拿不掉。
#
# log.pinterest.com（App 埋点）默认**不拦**：拦住可能让 App 反复重试上报。
# 想拦就把最后那行前面的 # 去掉。
# ---------------------------------------------------------------

rules:
  # 广告投放
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ads-dev.pinterest.com
      policy: REJECT
  - domain:
      match: ads-api.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT
  # 点击 / 转化追踪
  - domain:
      match: ct.pinterest.com
      policy: REJECT
  - domain:
      match: trk.pinterest.com
      policy: REJECT
  - domain:
      match: analytics.pinterest.com
      policy: REJECT
  # 第三方嵌入组件（常带推广位）
  - domain:
      match: widgets.pinterest.com
      policy: REJECT
  # 默认可选：App 自身埋点，拦了可能引发重试
  # - domain:
  #     match: log.pinterest.com
  #     policy: REJECT

dns: {}
