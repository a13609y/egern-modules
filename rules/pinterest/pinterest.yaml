name: Pinterest 去广告
description: 去掉 Pinterest 信息流、搜索结果里的推广 Pin（Promoted Pins），并拦掉明确的广告域名。v3 去掉了那条会误伤加载的 QUIC(UDP443) 拦截规则，改写只删广告条目、不改 JSON 结构。图片 CDN（i.pinimg.com / s.pinimg.com）不动。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# v3.0.0（2026-11-10）
# 相对 v2 的唯一实质变化：删掉「REJECT api.pinterest.com UDP 443」这条规则。
# 原因：设备日志显示只有 /v3/callback/event/、/v3/experiences/ 这种小请求进入脚本，
# 信息流与 related 的大请求完全没被脚本看到。QUIC 被 REJECT 后，部分客户端
# 不会立刻回落到 TCP，而是一直重试 HTTP/3 → 请求挂住 → 骨架屏永远转圈。
# 让 QUIC 走原生通道至少不会再卡住页面；能不能去广告用下面的实测结果判断。
# ---------------------------------------------------------------

rules:
  # 明确的广告 / 点击追踪域名
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com
    - www.pinterest.com
    - in.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/([a-z0-9-]+\.)*pinterest\.com\/'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest.js
      body_required: true
      max_size: 8388608
      timeout: 20
      update_interval: 86400

dns: {}
