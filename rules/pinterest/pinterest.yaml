name: Pinterest 去广告
description: 只清瀑布流与「更多探索」里的推广 Pin。接口/写法与上游可莉模块一致：只命中 /v\d/feeds/home/ 与 /v\d/pins/<id>/related/modules/ 两个路径，用最保守的过滤（只按 is_promoted 过滤 data 数组）。相关推荐接口 /v3/visual_search/…/module/ 完全不碰。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# v5.0.0（2026-11-10）
# 完全对齐上游可莉模块（kelee.one）的两个接口，不再「整站匹配」：
#   /v\d/feeds/home/?
#   /v\d/pins/<数字>/related/modules/?
# 只做一件事：把响应里 data 数组里 is_promoted 为 true 的条目过滤掉。
# 不去碰 ads 容器、不碰字典、不碰 visual_search（那是「更多类似内容」真实接口）。
# 脚本文件名换成 pinterest-v5.js，是为了绕开 Egern 对脚本 url 的 24 小时缓存
# —— 旧文件名会被当成「已下载过」直接复用旧内容。
# ---------------------------------------------------------------

rules:
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/api\.pinterest\.com\/v\d+\/(feeds\/home|pins\/\d+\/related\/modules)\/'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest-v5.js
      body_required: true
      max_size: 8388608
      timeout: 20
      update_interval: 3600

dns: {}
