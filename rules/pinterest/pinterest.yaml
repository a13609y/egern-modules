name: Pinterest 去广告
description: 去掉 Pinterest 信息流、搜索结果、“更多类似内容”里的推广 Pin（Promoted Pins），并拦掉广告与点击追踪域名。v2 只在「原样删除广告条目」的前提下改写，广告容器键一律保留为空值，不会让「更多类似内容」加载失败。图片 CDN（i.pinimg.com / s.pinimg.com）不动。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# v2.0.0（2026-11-10）
# 1. 主体是 scriptings 里的 http_response 脚本（pinterest.js）：
#    匹配整个 api.pinterest.com，抽掉带 is_promoted / is_sponsored / is_ad 的条目。
# 2. v2 关键修正：广告容器键（ads / promoted_pins / sponsored_pins …）不再 delete，
#    而是清空成 [] 或 {}。v1 直接删键会让客户端读到 undefined → forEach 抛异常 →
#    「从首页点开图片、下面更多类似内容」整块加载不出来。
# 3. 下面的域名 REJECT 只针对明确的广告与点击追踪域名，不走 MITM。
# 4. 必须开启 MITM 并在系统里信任 Egern 证书，否则改不了 HTTPS 响应。
# ---------------------------------------------------------------

rules:
  # 广告 / 转化追踪域名，直接拒绝
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT
  - domain:
      match: ct.pinterest.com
      policy: REJECT
  - domain:
      match: trk.pinterest.com
      policy: REJECT
  # 阻止 api.pinterest.com 走 QUIC(HTTP/3)，否则 UDP 443 绕过 MITM，脚本永远不跑
  - and:
      match:
        - protocol:
            match: 'udp'
        - dest_port:
            match: '443'
        - domain:
            match: 'api.pinterest.com'
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/api\d*\.pinterest\.com\/'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest.js
      body_required: true
      max_size: 8388608
      timeout: 20
      update_interval: 86400

dns: {}
