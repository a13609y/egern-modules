name: Pinterest 去广告
description: 跟随上游可莉模块自动同步。只清 /v\d/feeds/home/ 与 /v\d/pins/<id>/related/modules/ 里的推广 Pin（is_promoted），其余路径不接手、不改写。图片 CDN 不动。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# 本文件由 sync.py 自动生成（.github/workflows/sync-pinterest.yml 每天跑一次）。
# 上游：https://raw.githubusercontent.com/axtyet/Luminous/main/Repcz/Surge/Module/Kelee/Pinterest_remove_ads.sgmodule
# 上游版本：2026-06-01 17:11:35
# 路径白名单：
  #   api\.pinterest\.com\/v\d\/feeds\/home\/
  #   api\.pinterest\.com\/v\d\/pins\/\d+\/related\/modules\/
# ---------------------------------------------------------------

rules:
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT
  - domain:
      match: ct.pinterest.com
      policy: REJECT
  - domain:
      match: trk.pinterest.com
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/((?:api\.pinterest\.com\/v\d\/feeds\/home\/)|(?:api\.pinterest\.com\/v\d\/pins\/\d+\/related\/modules\/))'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest.js
      body_required: true
      max_size: 8388608
      timeout: 20
      update_interval: 86400

dns: {}
