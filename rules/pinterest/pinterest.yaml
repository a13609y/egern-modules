name: Pinterest 去广告
description: 只清 Pinterest 信息流与搜索结果里的推广 Pin（Promoted Pins）。v4 把脚本收窄到 /v3/feeds/ 与 /v3/search/ 两个路径，「更多类似内容」（/v3/visual_search/…/module/、/v3/pins/…/related/）完全不接手，不会再卡住那一块。图片 CDN 不动。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest
icon: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/icon.png

# ---------------------------------------------------------------
# v4.0.0（2026-11-10）
# 设备实测结论（逐项 A/B）：
#   · 只开 MITM、不挂脚本 → 「更多类似内容」正常
#   · 挂脚本（无论 body_required true/false、无论改不改写）→ 这一块一直转圈
# 日志显示「更多类似内容」的真实接口是
#   /v3/visual_search/stela/pins/<id>/module/
# 只要这个路径上挂了 http_response 脚本就会坏，跟改写逻辑无关。
# 所以 v4 直接不接手这条路径：脚本 match 与脚本内部白名单都只放行
# /v3/feeds/ 与 /v3/search/，其余一律不读 body、不改写。
# 代价：类似内容里的广告会保留。换来的是页面能正常加载。
# ---------------------------------------------------------------

rules:
  - domain:
      match: ads.pinterest.com
      policy: REJECT
  - domain:
      match: ad.pinterest.com
      policy: REJECT

mitm:
  hostnames:
    - api.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/api\d*\.pinterest\.com\/v\d*\/(feeds|search)\/'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest.js
      body_required: true
      max_size: 8388608
      timeout: 20
      update_interval: 86400

dns: {}
