name: Pinterest 测试B（脚本 + 不预读 body）
description: 诊断用，不是去广告模块。挂上改写脚本，但关掉 body_required、把 max_size 提到 32MB，脚本里 MODE 保持 clean。用来验证「大响应被截断/预读导致加载失败」这个假设。
author: a13609y
homepage: https://github.com/a13609y/egern-modules-hub/tree/main/rules/pinterest

mitm:
  hostnames:
    - api.pinterest.com

scriptings:
  - http_response:
      name: pinterest_remove_ads
      match: '^https?:\/\/api\d*\.pinterest\.com\/'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules-hub/main/rules/pinterest/pinterest.js
      body_required: false
      max_size: 33554432
      timeout: 20
      update_interval: 86400

dns: {}
