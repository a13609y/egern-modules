name: 番茄小说去广告（增强版）
description: 精确拦截番茄/红果/字节系广告：广告计费接口、穿山甲 SDK、广告素材签名、章末广告视频；保留正片、图床、风控与听书。比只靠 -lf/-lq 关键词的版本补上了会漏的几条路。
author: a13609y
homepage: https://github.com/a13609y/egern-modules/tree/main/rules/fanqie-adblock

# 用法：导入后完全退出番茄小说 → 清一次 App 缓存（或在设置里清）→ 重开。
# 被 DNS 拦掉之后，已经缓存在本地的广告还会再播几次，属于正常现象。

rules:
  # ── 1. 广告计费 / 广告位调度（番茄自己的广告接口）
  - domain_regex:
      match: "^ads[0-9]*-normal(?:-[a-z0-9]+)?\\.zijieapi\\.com$"
      policy: REJECT
      name: 广告接口 ads*-normal
  - domain_regex:
      match: "^minigame[0-9]*-normal(?:-[a-z0-9]+)?\\.zijieapi\\.com$"
      policy: REJECT
      name: 小游戏广告位
  - domain_regex:
      match: "^tnc[0-9]+-(?:aliec[0-9]+|alisc[0-9]+)\\.zijieapi\\.com$"
      policy: REJECT
      name: 广告位调度 TNC
  - domain_suffix:
      match: ad.toutiao.com
      policy: REJECT

  # ── 2. 穿山甲（Pangle）广告 SDK —— 番茄广告漏网的主因
  - domain_suffix:
      match: pangolin-sdk-toutiao.com
      policy: REJECT
  - domain_suffix:
      match: pangolin-sdk-toutiao1.com
      policy: REJECT
  - domain_suffix:
      match: pglstatp-toutiao.com
      policy: REJECT
  - domain_suffix:
      match: pangle.io
      policy: REJECT
  - domain_suffix:
      match: www.chengzijianzhan.com
      policy: REJECT

  # ── 3. 广告素材（只拦广告子域，不碰正片签名/图床）
  - domain_regex:
      match: "^p[0-9]+-ad-sign\\.byteimg\\.com$"
      policy: REJECT
      name: 广告图片签名
  - domain_regex:
      match: "^v[0-9]+-(?:(?:bd|se|se-sjy)-daily-)?reading-ad\\.qznovelvod\\.com$"
      policy: REJECT
      name: 章末/前贴片广告视频（正片是 reading-video，不动）
  - domain_suffix:
      match: sf3-ttcdn-tos.pstatp.com
      policy: REJECT

  # ── 4. 激励视频、广告弹窗、跳转追踪
  - domain_suffix:
      match: praisewindow.ugsdk.cn
      policy: REJECT
  - domain:
      match: praisewindow-sinfonlinea.ugsdk.cn
      policy: REJECT
  - domain_suffix:
      match: zlink.ugsdk.cn
      policy: REJECT
  - domain_suffix:
      match: dig.bdurl.net
      policy: REJECT
  - domain_suffix:
      match: wmzfylgdsz.com
      policy: REJECT
  - domain_suffix:
      match: activity-ag.awemeughun.com
      policy: REJECT
  - domain_suffix:
      match: l2-toutiao-quic-ipv6-ml.gslb.ksyuncdn.com
      policy: REJECT

  # ── 5. 第三方广告/登录跳转
  - domain_suffix:
      match: msync-im1-vip6-std.easemob.com
      policy: REJECT
  - domain_suffix:
      match: apd-pcdnwxlogin.teg.tencent-cloud.net
      policy: REJECT
  - domain_suffix:
      match: api.iegadp.qq.com
      policy: REJECT

  # ── 6. 埋点（默认关；残留广告上报占用不多，开了可能影响金币奖励判断）
  - domain_regex:
      match: "^(?:rt)?log[0-9]*-applog-(?:lf|hl)\\.fqnovel\\.com$"
      policy: REJECT
      disabled: true
  - domain_regex:
      match: "^mon[0-9]+-misc-(?:lf|hl)\\.fqnovel\\.com$"
      policy: REJECT
      disabled: true

  # ── 7. 归因上报（默认关；这几条能少几秒开屏，但个别版本反馈影响风控/登录）
  - domain:
      match: i.snssdk.com
      policy: REJECT
      disabled: true
  - domain:
      match: i-lq.snssdk.com
      policy: REJECT
      disabled: true
  - domain:
      match: mcs.snssdk.com
      policy: REJECT
      disabled: true

url_rewrites:
  # 穿山甲广告接口直接返回空 JSON：SDK 立刻进入「无广告」分支。
  # 比单纯 REJECT（连接被断 → SDK 换线路重试）更稳，这条是「广告有时又冒出来」的关键补丁。
  - match: "^https?://[^/]*\\.pangolin-sdk-toutiao(?:1)?\\.com/api/ad/union/sdk/(?:get_ads|stats|settings)/"
    location: "http://reject-dict/"
  - match: "^https?://[^/]*\\.pglstatp-toutiao\\.com/.+/toutiao\\.mp4"
    location: "http://reject-video/"
  - match: "^https?://[^/]*\\.(?:pglstatp-toutiao|pstatp)\\.com/(?:obj|img)/(?:ad-app-package|ad|ad-pattern)/"
    location: "http://reject-video/"

# 只有上面的 url_rewrites 需要 MITM；第 1~5 组域名规则不需要证书也能拦。
# 没装 Egern 根证书时，域名规则照常生效，只是 url_rewrites 不生效。
mitm:
  hostnames:
    includes:
      - "*.pangolin-sdk-toutiao.com"
      - "*.pangolin-sdk-toutiao1.com"
      - "*.pglstatp-toutiao.com"
      - "*.pstatp.com"
