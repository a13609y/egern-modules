name: 番茄小说去广告（增强版）
description: >-
  精确拦截番茄/红果/字节系广告：广告计费接口、穿山甲 SDK、广告素材签名、章末广告视频。
  域名表由 rules/fanqie-adblock/sync.py 每天从上游聚合，正片/图床/风控域名有硬黑名单保护。
author: a13609y
homepage: https://github.com/a13609y/egern-modules/tree/main/rules/fanqie-adblock

# 本文件由 sync.py 自动生成，请勿手改（改了下次同步会被覆盖）。
# 激活规则 52 条；备用（默认关闭）20 条
# 上游：abclq/clash-surge、abclq/fq-conf、bluee1111/hongguo、fmz200/sgmodule、honue/loon

# 用法：导入后彻底退出番茄小说 → 清一次缓存 → 重开。
# 已缓存到本地的广告会再播几次才消失，不是规则失效。

rules:
  # ── 1. 广告家族正则（覆盖上游还没抓到的子域）
  - domain_regex:
      match: '^ads[0-9]*-normal(?:-[a-z0-9]+)?\.zijieapi\.com$'
      policy: REJECT
      name: "广告计费接口 ads*-normal"
  - domain_regex:
      match: '^minigame[0-9]*-normal(?:-[a-z0-9]+)?\.zijieapi\.com$'
      policy: REJECT
      name: "小游戏广告位"
  - domain_regex:
      match: '^tnc[0-9]+-(?:aliec[0-9]+|alisc[0-9]+)\.zijieapi\.com$'
      policy: REJECT
      name: "广告位调度 TNC"
  - domain_regex:
      match: '^p[0-9]+-ad-sign\.byteimg\.com$'
      policy: REJECT
      name: "广告图片签名"
  - domain_regex:
      match: '^v[0-9]+-(?:(?:bd|se|se-sjy)-daily-)?reading-ad\.qznovelvod\.com$'
      policy: REJECT
      name: "章末/前贴片广告视频（正片是 reading-video，不动）"

  # ── 2. 上游聚合的精确广告域名
