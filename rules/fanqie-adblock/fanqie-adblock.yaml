url_rewrites:
  # 穿山甲广告接口直接返回空 JSON：SDK 立刻进入「无广告」分支。
  # 比单纯 REJECT（断连 → SDK 换线路重试）更稳。
  - match: '^https?://[^/]*\.pangolin-sdk-toutiao(?:1)?\.com/api/ad/union/sdk/(?:get_ads|stats|settings)/'
    location: "http://reject-dict/"
  - match: '^https?://[^/]*\.pglstatp-toutiao\.com/.+/toutiao\.mp4'
    location: "http://reject-video/"
  - match: '^https?://[^/]*\.pglstatp-toutiao\.com/(?:obj|img)/(?:ad-app-package|ad|ad-pattern)/'
    location: "http://reject-video/"

# 只有上面的 url_rewrites 需要 MITM；域名规则不装证书也生效。
mitm:
  hostnames:
    includes:
      - "*.pangolin-sdk-toutiao.com"
      - "*.pangolin-sdk-toutiao1.com"
      - "*.pglstatp-toutiao.com"
