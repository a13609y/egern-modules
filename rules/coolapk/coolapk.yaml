name: 酷安去广告
description: 彻底去除酷安开屏（不再出现空白开屏与“跳过”按钮）、热启动开屏、首页/动态详情/评论区赞助卡片与热搜。首次启用后请删除重装酷安一次。
author: a13609y
homepage: https://github.com/a13609y/egern-modules/tree/main/rules/coolapk
icon: https://raw.githubusercontent.com/zirawell/R-Store/main/Res/Icon/App/coolapk.png

# ⚠️ 本文件由 rules/coolapk/sync.py 自动生成，请勿手动修改。
# 上游模块 : https://raw.githubusercontent.com/alloflights/shadowrocket-rules/main/modules/coolapk.sgmodule
# 上游脚本 : https://raw.githubusercontent.com/alloflights/shadowrocket-rules/main/modules/scripts/coolapk.js
# 上游 hash : 9eaa3600f592
# 生成时间 : 2026-11-04 06:12 UTC

# 阻断 QUIC（UDP 443）与广告域名，否则酷安走 HTTP/3 时 MITM 抓不到，脚本永远不跑
rules:
  - and:
      match:
        - protocol:
            match: 'udp'
        - dest_port:
            match: '443'
        - domain:
            match: 'api.coolapk.com'
      policy: REJECT
  - and:
      match:
        - protocol:
            match: 'udp'
        - dest_port:
            match: '443'
        - domain:
            match: 'api2.coolapk.com'
      policy: REJECT
  - domain:
      match: ad.api.coolapk.com
      policy: REJECT

mitm:
  hostnames:
    - api.coolapk.com
    - api2.coolapk.com

url_rewrites:
  - match: '^https?:\/\/api\d*\.coolapk\.com\/v6\/search\?.*type=hotSearch'
    location: http://reject-dict/

scriptings:
  - http_request:
      name: coolapk_init_req
      match: '^https?:\/\/api\d*\.coolapk\.com\/v6\/main\/init'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/rules/coolapk/coolapk.js
      body_required: false
      timeout: 10
      update_interval: 86400
  - http_response:
      name: coolapk_init
      match: '^https?:\/\/api\d*\.coolapk\.com\/v6\/main\/init'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/rules/coolapk/coolapk.js
      body_required: true
      max_size: 1048576
      timeout: 10
      update_interval: 86400
  - http_response:
      name: coolapk_feed
      match: '^https?:\/\/api\d*\.coolapk\.com\/v6\/(main\/(indexV\d+|dataList)|page\/dataList|feed\/(detail|replyList|index))'
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/rules/coolapk/coolapk.js
      body_required: true
      max_size: 2097152
      timeout: 10
      update_interval: 86400

dns: {}
