name: 节日倒数
description: 距离下一个假期还有多少天 · 超大天数 + 节日胶囊 + 底部七格假期条 · 另有九宫格排版可切换 · 数据内置到 2050 年，不联网
author: a13609y
homepage: https://github.com/a13609y/egern-modules/tree/main/widgets/holiday-countdown
icon: https://raw.githubusercontent.com/a13609y/egern-modules/main/widgets/holiday-countdown/icon.png

# ── 模块参数默认值（用户可在「模块设置」里覆盖）────────────────
compat_arguments:
  TITLE: 节日倒数
  TRANSPARENT: "false"
  THEME: auto
  GRID_ITEMS: "0"
  SHOW_TERMS: "true"
  SHOW_WESTERN: "true"
  ANNIVERSARIES: ""
  HERO_ICON: "on"
  ART_COLOR: ""
  ART_SIZE: "100"
  ART_X: ""
  ART_Y: ""

compat_arguments_desc: |
  所有节日（含二十四节气与现代节日）按「还有几天」排成网格：大号 15 条、中号 7 条、小号 1 条 + 底部两条。
  大号和中号右上角有胶囊，显示最近那个节日的名字和日期。
  背景自动切换：节日当天暖橙、周末冷蓝、工作日浅灰，深浅色各一套。
  节气绿色、现代节日金色、法定与传统节日主色。

env_schema:
  TITLE:
    name: 标题
    description: 小组件左上角显示的标题
    default_value: 节日倒数
  TRANSPARENT:
    name: 透明模式
    description: 不画背景渐变，只保留极淡描边，露出壁纸
    default_value: "false"
    options:
      - "false"
      - "true"
  THEME:
    name: 背景主题
    description: auto = 节日当天暖橙、周末冷蓝、其余浅灰；也可以强制固定一种
    default_value: auto
    options:
      - auto
      - fest
      - weekend
      - workday
  GRID_ITEMS:
    name: 最多显示条数
    description: 0 = 按组件实际高度自动计算（推荐）；填数字则强制上限，填太大会被自动裁到放得下的数量
    default_value: "0"
  SHOW_TERMS:
    name: 显示二十四节气
    description: 小寒、立春、惊蛰…共 24 个，绿色显示
    default_value: "true"
    options:
      - "true"
      - "false"
  SHOW_WESTERN:
    name: 显示现代节日
    description: 情人节、妇女节、愚人节、表白日、儿童节、教师节、万圣夜、光棍节、双十二、平安夜、圣诞、跨年夜、母亲节、父亲节、感恩节，金色显示
    default_value: "true"
    options:
      - "true"
      - "false"
  HERO_ICON:
    name: 主图（鲸鱼娘剪影）
    description: on 用鲸鱼娘剪影替换圆环（默认）/ off 退回原来的圆环进度
    default_value: "on"
    options:
      - "on"
      - "off"
  ART_COLOR:
    name: 主图颜色
    description: 留空跟随主题（默认深灰 #3A3A3C，节假日红、周末蓝）；也可以填 #RRGGBB 固定颜色
    default_value: ""
  ART_SIZE:
    name: 主图大小
    description: 百分比 40~200。100 = 默认尺寸；只影响图本身，不会推动旁边的文字
    default_value: "100"
  ART_X:
    name: 主图水平位置 X
    description: 图标中心在组件宽度上的百分比 0~100，留空 = 版式默认。数字越大越靠右
    default_value: ""
  ART_Y:
    name: 主图垂直位置 Y
    description: 图标中心在组件高度上的百分比 0~100，留空 = 版式默认。数字越大越靠下
    default_value: ""
  ANNIVERSARIES:
    name: 自定义纪念日
    description: 用逗号分隔，格式「名字=05-20」每年循环，或「名字=2026-02-01」只算一次
    default_value: ""

dns: {}

scriptings:
  - generic:
      name: holiday-countdown
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/widgets/holiday-countdown/holiday-countdown.js
      timeout: 15
      env:
        TITLE: "{{{TITLE}}}"
        TRANSPARENT: "{{{TRANSPARENT}}}"
        THEME: "{{{THEME}}}"
        GRID_ITEMS: "{{{GRID_ITEMS}}}"
        SHOW_TERMS: "{{{SHOW_TERMS}}}"
        SHOW_WESTERN: "{{{SHOW_WESTERN}}}"
        ANNIVERSARIES: "{{{ANNIVERSARIES}}}"
        HERO_ICON: "{{{HERO_ICON}}}"
        ART_COLOR: "{{{ART_COLOR}}}"
        ART_SIZE: "{{{ART_SIZE}}}"
        ART_X: "{{{ART_X}}}"
        ART_Y: "{{{ART_Y}}}"

widgets:
  - name: 节日倒数
    script_name: holiday-countdown
