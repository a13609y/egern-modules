name: 节日倒数
description: 距离下一个假期还有多少天 · 鲸鱼娘剪影主图（颜色/大小/位置可调）+ 右侧节日列表 · 数据内置到 2050 年，不联网
author: a13609y
homepage: https://github.com/a13609y/egern-modules/tree/main/widgets/holiday-countdown
icon: https://raw.githubusercontent.com/a13609y/egern-modules/main/widgets/holiday-countdown/icon.png

# ── 模块参数默认值（用户可在「模块设置」里覆盖）────────────────
compat_arguments:
  TITLE: 节日倒数
  TRANSPARENT: "false"
  THEME: auto
  GRID_ITEMS: "0"
  SHOW_TERMS: "true"
  SHOW_WESTERN: "true"
  ART_COLOR: ""
  ART_SIZE: ""
  ART_X: ""
  ART_Y: ""
  ART_SIZE_S: ""
  ART_X_S: ""
  ART_Y_S: ""
  ART_SIZE_M: ""
  ART_X_M: ""
  ART_Y_M: ""
  ART_SIZE_L: ""
  ART_X_L: ""
  ART_Y_L: ""
  ANNIVERSARIES: ""

# ── 模块设置页自动生成的 UI 控件 ────────────────────────────
env_schema:
  TITLE:
    name: 标题
    description: 顶部左侧显示的文字
    default_value: 节日倒数
  TRANSPARENT:
    name: 透明模式
    description: 不画背景，只留一圈极淡描边，适合配壁纸
    default_value: "false"
    options:
      - "true"
      - "false"
  THEME:
    name: 背景主题
    description: auto 自动（节假日暖色 / 周末蓝 / 平日白）/ fest 节日 / weekend 周末 / workday 平日
    default_value: auto
    options:
      - auto
      - fest
      - weekend
      - workday
  GRID_ITEMS:
    name: 最多显示条数
    description: 0 = 按画布自动计算；填数字则强制上限
    default_value: "0"
  SHOW_TERMS:
    name: 显示二十四节气
    default_value: "true"
    options:
      - "true"
      - "false"
  SHOW_WESTERN:
    name: 显示现代节日
    default_value: "true"
    options:
      - "true"
      - "false"
  ART_COLOR:
    name: 主图颜色
    description: 留空 = 深灰 #3A3A3C；也可以填 #RRGGBB，例如 #DD0207
    default_value: ""
  ART_SIZE:
    name: 主图大小（通用）
    description: 百分比 40~300，留空 = 100。下面三个分尺寸的优先
    default_value: ""
  ART_X:
    name: 主图水平 X（通用）
    description: 50 = 槽中心；数字越小越靠左，越大越靠右（可填 0~100 之外做微调）
    default_value: ""
  ART_Y:
    name: 主图垂直 Y（通用）
    description: 50 = 槽中心；数字越小越靠上，越大越靠下
    default_value: ""
  ART_SIZE_S:
    name: 小号 · 主图大小
    description: 只作用于小号，留空则用通用值
    default_value: ""
  ART_X_S:
    name: 小号 · 水平 X
    default_value: ""
  ART_Y_S:
    name: 小号 · 垂直 Y
    default_value: ""
  ART_SIZE_M:
    name: 中号 · 主图大小
    default_value: ""
  ART_X_M:
    name: 中号 · 水平 X
    default_value: ""
  ART_Y_M:
    name: 中号 · 垂直 Y
    default_value: ""
  ART_SIZE_L:
    name: 大号 · 主图大小
    default_value: ""
  ART_X_L:
    name: 大号 · 水平 X
    default_value: ""
  ART_Y_L:
    name: 大号 · 垂直 Y
    default_value: ""
  ANNIVERSARIES:
    name: 自定义纪念日
    description: 用逗号分隔，格式「名字=05-20」每年循环，或「名字=2026-02-01」只算一次
    default_value: ""

dns: {}

scriptings:
  - generic:
      name: holiday-countdown
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/widgets/holiday-countdown/holiday-countdown.js
      timeout: 15
      env:
        TITLE: "{{{TITLE}}}"
        TRANSPARENT: "{{{TRANSPARENT}}}"
        THEME: "{{{THEME}}}"
        GRID_ITEMS: "{{{GRID_ITEMS}}}"
        SHOW_TERMS: "{{{SHOW_TERMS}}}"
        SHOW_WESTERN: "{{{SHOW_WESTERN}}}"
        ART_COLOR: "{{{ART_COLOR}}}"
        ART_SIZE: "{{{ART_SIZE}}}"
        ART_X: "{{{ART_X}}}"
        ART_Y: "{{{ART_Y}}}"
        ART_SIZE_S: "{{{ART_SIZE_S}}}"
        ART_X_S: "{{{ART_X_S}}}"
        ART_Y_S: "{{{ART_Y_S}}}"
        ART_SIZE_M: "{{{ART_SIZE_M}}}"
        ART_X_M: "{{{ART_X_M}}}"
        ART_Y_M: "{{{ART_Y_M}}}"
        ART_SIZE_L: "{{{ART_SIZE_L}}}"
        ART_X_L: "{{{ART_X_L}}}"
        ART_Y_L: "{{{ART_Y_L}}}"
        ANNIVERSARIES: "{{{ANNIVERSARIES}}}"

widgets:
  - name: 节日倒数
    script_name: holiday-countdown
