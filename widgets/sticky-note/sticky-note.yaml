name: 便签
description: 桌面便签小组件 · 9 种纸张样式（信纸/便利贴/方格纸/牛皮纸/黑板/透明…）· 文字自己填，留空即不显示
author: a13609y
homepage: https://github.com/a13609y/egern-modules
icon: note.text

# ── 模块参数默认值（用户可在「模块设置」里逐项覆盖）──────────────
compat_arguments:
  TITLE: ""
  LINE1: ""
  LINE2: ""
  LINE3: ""
  LINE4: ""
  LINE5: ""
  LINE6: ""
  LINE7: ""
  LINE8: ""
  STYLE: paper
  SIZE: "15"
  ALIGN: center
  LOCK_SIZE: "15"

compat_arguments_desc: |
  在下面填文字就行：TITLE 是标题，LINE1~LINE8 是正文各行，留空就不显示。
  想空一行就写一个 - 号。
  字太长会自动显示成省略号，不会缩字。锁屏组件的字号单独用「锁屏字号」调。

# ── 模块设置页自动生成的 UI 控件（只留最常用的几项）──────────────
env_schema:
  TITLE:
    name: 标题
    description: 第一行加粗显示，留空不显示。
    default_value: ""
  LINE1:
    name: 第 1 行
    description: 留空不显示；写单个 - 表示空一行。
    default_value: ""
  LINE2:
    name: 第 2 行
    default_value: ""
  LINE3:
    name: 第 3 行
    default_value: ""
  LINE4:
    name: 第 4 行
    default_value: ""
  LINE5:
    name: 第 5 行
    default_value: ""
  LINE6:
    name: 第 6 行
    default_value: ""
  LINE7:
    name: 第 7 行
    default_value: ""
  LINE8:
    name: 第 8 行
    default_value: ""
  STYLE:
    name: 纸张样式
    description: paper 米白信纸 / sticky 黄色便利贴 / rose 粉色便签 / memo 备忘录白 / kraft 牛皮纸 / grid 方格纸 / chalk 黑板 / night 深蓝夜 / transparent 透明
    default_value: paper
    options:
      - paper
      - sticky
      - rose
      - memo
      - kraft
      - grid
      - chalk
      - night
      - transparent
  SIZE:
    name: 字号
    description: 默认 15，字号固定不变；一行写太长会自动省略，不会缩字。
    default_value: "15"
  ALIGN:
    name: 主屏幕对齐
    description: center 标题和正文都居中（默认）/ left 全部靠左
    default_value: center
    options:
      - center
      - left
  LOCK_SIZE:
    name: 锁屏字号
    description: 锁屏小组件（accessory）用的字号，可以和主屏幕不一样。默认 15，可填 9~32。
    default_value: "15"

dns: {}

scriptings:
  - generic:
      name: sticky-note
      script_url: https://raw.githubusercontent.com/a13609y/egern-modules/main/widgets/sticky-note/sticky-note.js
      timeout: 10
      env:
        TITLE: "{{{TITLE}}}"
        LINE1: "{{{LINE1}}}"
        LINE2: "{{{LINE2}}}"
        LINE3: "{{{LINE3}}}"
        LINE4: "{{{LINE4}}}"
        LINE5: "{{{LINE5}}}"
        LINE6: "{{{LINE6}}}"
        LINE7: "{{{LINE7}}}"
        LINE8: "{{{LINE8}}}"
        STYLE: "{{{STYLE}}}"
        SIZE: "{{{SIZE}}}"
        ALIGN: "{{{ALIGN}}}"
        LOCK_SIZE: "{{{LOCK_SIZE}}}"

widgets:
  - name: 便签
    script_name: sticky-note
