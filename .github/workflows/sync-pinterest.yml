name: sync-pinterest

on:
  schedule:
    - cron: "53 3 * * *" # 每天 03:53 UTC（北京时间 11:53）跟一次上游
  workflow_dispatch:
  push:
    paths:
      - "rules/pinterest/**"
      - ".github/workflows/sync-pinterest.yml"

permissions:
  contents: write

concurrency:
  group: sync-pinterest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉上游 → 重生成模块
        run: python3 rules/pinterest/sync.py

      - name: 静态校验
        run: |
          python3 - <<'PY'
          import json, re, sys, yaml

          yml = open('rules/pinterest/pinterest.yaml', encoding='utf-8').read()
          js = open('rules/pinterest/pinterest.js', encoding='utf-8').read()
          d = yaml.safe_load(yml)

          assert d.get('mitm', {}).get('hostnames'), 'mitm.hostnames 为空'
          sc = d['scriptings'][0]['http_response']
          assert sc['match'].startswith('^https'), 'match 不是锚定正则'
          assert sc['script_url'].endswith('/pinterest.js'), 'script_url 指向错误'
          assert 'visual_search' not in sc['match'], 'match 里出现了 visual_search（不在上游白名单）'

          assert 'PATH_SOURCES' in js, '生成的脚本缺少路径白名单'
          assert 'is_promoted' in js, '生成的脚本缺少过滤字段'
          assert 'export default' in js, '生成的脚本缺少默认导出'

          paths = [json.loads(m) for m in re.findall(r'"(?:[^"\\]|\\.)*"', js.split('PATH_SOURCES = [')[1].split('];')[0])]
          assert len(paths) == 2, f'上游路径应为 2 条，实际 {len(paths)} 条'
          for p in paths:
              assert 'api\\.pinterest\\.com' in p, f'路径不在 api.pinterest.com: {p}'

          print(f'module ok: {len(paths)} 条路径 / mitm={d["mitm"]["hostnames"]}')
          PY

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rules/pinterest)" ]; then
            git add rules/pinterest
            git commit -m "chore(pinterest): 跟随上游更新 $(date -u +%F)"
            git push
            echo "::notice::已同步上游更新"
          else
            echo "上游无变化"
          fi
